plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xttrading.signals'
    compileSdk 35
    def backendUrl = project.findProperty('SIGNAL_BACKEND_URL') ?: 'https://YOUR-BACKEND.example.com'

    defaultConfig {
        applicationId 'com.xttrading.signals'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'SIGNAL_BACKEND_URL', '"' + backendUrl + '"'
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
}
